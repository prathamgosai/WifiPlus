name: speedtest-server CI

# Typechecks and tests the edge measurement server on every change to server/.
on:
  push:
    paths: ["server/**", ".github/workflows/server-ci.yml"]
  pull_request:
    paths: ["server/**", ".github/workflows/server-ci.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # Node 24 rather than 20: Node 20 reached end-of-life in April 2026, and
          # the runner already forces the actions above onto Node 24. Pinning the
          # job to 20 meant CI was the only place this code ran on an unsupported
          # runtime. NOTE: package.json still declares "engines": ">=20", which is
          # now a claim nothing verifies — raise it or add a matrix if that floor
          # is meant to be real.
          node-version: "24"
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
