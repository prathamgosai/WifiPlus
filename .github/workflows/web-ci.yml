name: core + web CI

# The measurement engine and the Next.js app had no CI at all: a type error, a
# broken build or a regression in the throughput maths could ship unnoticed.
# `core` is the shared engine both front ends import, so its tests gate both.
on:
  push:
    paths: ["core/**", "web/**", "app.js", "index.html", ".github/workflows/web-ci.yml"]
  pull_request:
    paths: ["core/**", "web/**", "app.js", "index.html", ".github/workflows/web-ci.yml"]

jobs:
  core:
    name: core engine
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # Node 24 rather than 20: Node 20 reached end-of-life in April 2026, and
          # the runner already forces the actions above onto Node 24. Pinning the
          # job to 20 meant CI was the only place this code ran on an unsupported
          # runtime. NOTE: package.json still declares "engines": ">=20", which is
          # now a claim nothing verifies — raise it or add a matrix if that floor
          # is meant to be real.
          node-version: "24"
      - run: npm install --no-audit --no-fund
      - name: Typecheck (JSDoc types, checkJs)
        run: npm run typecheck
      - name: Unit tests
        run: npm test

  web:
    name: web app
    runs-on: ubuntu-latest
    needs: core
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build (static export)
        run: npm run build

  static:
    name: static shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      # The static site has no build step by design, so the checks that matter are
      # that it parses and that every module it imports actually exists — a broken
      # import path would 404 at runtime with no build to catch it.
      - name: Parse check
        run: node --check app.js && node --check sw.js && node --check landing.js && node --check boot-check.js

      # A one-sided hreflang, a dangling alternate or malformed JSON-LD renders
      # perfectly in a browser and is silently ignored by search engines, so this
      # is the only place those mistakes can be caught.
      - name: SEO check (hreflang, JSON-LD, sitemap)
        run: node scripts/check-seo.mjs

      # Regenerating must be a no-op: if it isn't, someone edited generated HTML
      # by hand and their change will vanish on the next build.
      - name: Generated pages are up to date
        run: |
          node scripts/build-seo.mjs > /dev/null
          if ! git diff --quiet; then
            echo "Generated pages are stale. Run: node scripts/build-seo.mjs"
            git diff --stat
            exit 1
          fi
      - name: Verify module graph resolves
        run: |
          node -e '
            const fs = require("fs"), path = require("path");
            const files = ["app.js", ...fs.readdirSync("core").filter((f) => f.endsWith(".js")).map((f) => "core/" + f)];
            let missing = 0;
            for (const file of files) {
              const dir = path.dirname(file);
              for (const [, spec] of fs.readFileSync(file, "utf8").matchAll(/from "(\.[^"]+)"/g)) {
                const target = path.join(dir, spec);
                if (!fs.existsSync(target)) { console.error("missing:", target, "imported by", file); missing++; }
              }
            }
            if (missing) process.exit(1);
            console.log("module graph OK");
          '
