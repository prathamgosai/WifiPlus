<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="WifiPlus — free internet speed test and WiFi analyzer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071116"/>
      <stop offset="0.55" stop-color="#0b1f2a"/>
      <stop offset="1" stop-color="#05292e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2ee6a8"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- signal arcs -->
  <g fill="none" stroke="url(#accent)" stroke-linecap="round" opacity="0.9">
    <circle cx="965" cy="430" r="46" stroke-width="14" stroke-dasharray="145 400" transform="rotate(-135 965 430)"/>
    <circle cx="965" cy="430" r="96" stroke-width="14" stroke-dasharray="300 800" transform="rotate(-135 965 430)"/>
    <circle cx="965" cy="430" r="146" stroke-width="14" stroke-dasharray="455 1200" transform="rotate(-135 965 430)" opacity="0.55"/>
    <circle cx="965" cy="430" r="196" stroke-width="14" stroke-dasharray="610 1600" transform="rotate(-135 965 430)" opacity="0.25"/>
  </g>
  <circle cx="965" cy="430" r="13" fill="#2ee6a8"/>

  <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">
    <text x="88" y="196" fill="#7dd3fc" font-size="30" font-weight="700" letter-spacing="6">FREE · NO SIGNUP · NO ADS</text>
    <text x="88" y="300" fill="#ffffff" font-size="92" font-weight="800">WifiPlus</text>
    <text x="88" y="382" fill="#e2f5ff" font-size="46" font-weight="600">Internet Speed Test &amp;</text>
    <text x="88" y="444" fill="#e2f5ff" font-size="46" font-weight="600">WiFi Analyzer</text>
    <text x="88" y="524" fill="#8fb8c9" font-size="30" font-weight="500">Download · Upload · Ping · Jitter · Packet loss</text>
  </g>

  <rect x="88" y="560" width="150" height="6" rx="3" fill="url(#accent)"/>
</svg>
