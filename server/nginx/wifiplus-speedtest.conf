# NGINX front for a WifiPlus edge measurement server.
# TLS terminates here; NGINX speaks HTTP/2 (and HTTP/3 if built with it) to the
# browser while proxying to the Node app on 127.0.0.1:8080. Cloudflare in front
# adds HTTP/3/QUIC for free, so the origin can stay HTTP/1.1 — the measurement
# is still real bytes end to end.

upstream wifiplus_speedtest {
    server 127.0.0.1:8080;
    keepalive 64;
}

server {
    listen 443 ssl;
    http2 on;
    # HTTP/3 (needs an NGINX built with the QUIC module; otherwise drop this line):
    # listen 443 quic reuseport;
    server_name bom.speed.wifiplus.example;   # one hostname per region

    ssl_certificate     /etc/letsencrypt/live/bom.speed.wifiplus.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bom.speed.wifiplus.example/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # add_header Alt-Svc 'h3=":443"; ma=86400';   # advertise HTTP/3 when enabled

    # Uploads can be large; let them through.
    client_max_body_size 600M;
    client_body_timeout 120s;

    # CRITICAL for accuracy: never compress or buffer the measurement traffic,
    # or the timing reflects NGINX's buffer rather than the network.
    gzip off;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_http_version 1.1;

    location / {
        proxy_pass http://wifiplus_speedtest;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # WebSocket ping/loss channel needs the upgrade dance.
    location /ws/ {
        proxy_pass http://wifiplus_speedtest;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
    }
}

# Redirect plain HTTP to HTTPS.
server {
    listen 80;
    server_name bom.speed.wifiplus.example;
    return 301 https://$host$request_uri;
}
