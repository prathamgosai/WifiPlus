<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="WifiPlus — internet speed test and WiFi analyzer">
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#5b5ff0"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="bloomA" cx="0.16" cy="0.1" r="0.7">
      <stop offset="0%" stop-color="#5b5ff0" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#080b16" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bloomB" cx="0.9" cy="0.85" r="0.6">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#080b16" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="60%" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#080b16"/>
  <rect width="1200" height="630" fill="url(#bloomA)"/>
  <rect width="1200" height="630" fill="url(#bloomB)"/>
  <rect width="1200" height="10" fill="url(#bar)"/>

  <g font-family="Manrope, Inter, Segoe UI, sans-serif">
    <text x="74" y="188" fill="#ffffff" font-size="76" font-weight="800" letter-spacing="-2">WifiPlus</text>
    <text x="74" y="258" fill="url(#ink)" font-size="44" font-weight="700" letter-spacing="-1">Speed test · WiFi analyzer · ISP comparison</text>
    <text x="74" y="330" fill="#b8c0cc" font-size="27" font-weight="500">Real download, upload, ping, jitter, packet loss and DNS —</text>
    <text x="74" y="368" fill="#b8c0cc" font-size="27" font-weight="500">measured in your browser. Free, no signup.</text>

    <g transform="translate(74,432)">
      <rect width="252" height="112" rx="22" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="26" y="44" fill="#22d3ee" font-size="19" font-weight="800" letter-spacing="1.5">METRICS</text>
      <text x="26" y="88" fill="#ffffff" font-size="38" font-weight="800">7 live</text>

      <g transform="translate(276,0)">
        <rect width="252" height="112" rx="22" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.14"/>
        <text x="26" y="44" fill="#818cf8" font-size="19" font-weight="800" letter-spacing="1.5">COUNTRIES</text>
        <text x="26" y="88" fill="#ffffff" font-size="38" font-weight="800">24</text>
      </g>

      <g transform="translate(552,0)">
        <rect width="252" height="112" rx="22" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.14"/>
        <text x="26" y="44" fill="#c4b5fd" font-size="19" font-weight="800" letter-spacing="1.5">LANGUAGES</text>
        <text x="26" y="88" fill="#ffffff" font-size="38" font-weight="800">15</text>
      </g>
    </g>
  </g>

  <g transform="translate(940,150)" fill="none" stroke="#ffffff" stroke-linecap="round">
    <path d="M0 96a132 132 0 0 1 186 0" stroke-width="18" stroke-opacity="0.32"/>
    <path d="M38 141a79 79 0 0 1 110 0" stroke-width="18" stroke-opacity="0.55"/>
    <path d="M73 184a29 29 0 0 1 40 0" stroke-width="18" stroke-opacity="0.85"/>
    <circle cx="93" cy="223" r="17" fill="#22d3ee" stroke="none"/>
  </g>
